<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<meta name="theme-color" content="#f0f2f5"/>
<title>曼谷 4 日漫游 · 行程规划</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#f4f6f9;--white:#fff;--ink:#1a1a2e;--muted:#6b7280;--line:#e5e7eb;--indigo:#5B6CFF;--coral:#FF7A59;--purple:#9B5DE5;--teal:#2EC4B6;--slate:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.6 -apple-system,'PingFang SC',sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;min-height:100vh}
.banner{background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);padding:36px 24px 32px;color:#fff;text-align:center;border-radius:0 0 28px 28px}
.banner-inner{max-width:900px;margin:0 auto}
.b-title{font-size:34px;font-weight:900;letter-spacing:-.5px;line-height:1.25}
.tabs{display:flex;gap:10px;padding:20px 18px 4px;flex-wrap:wrap}
.tab{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted);padding:11px 18px;border-radius:14px;font-size:15px;font-weight:700;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab small{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:3px}
.tab:hover{transform:translateY(-1px)}
.tab.active{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--indigo),var(--purple));box-shadow:0 4px 14px rgba(91,108,255,.35)}
.view-switch{display:none;position:sticky;top:0;z-index:500;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;gap:8px}
.view-switch button{flex:1;padding:10px;border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.view-switch button.active{border-color:var(--indigo);color:var(--indigo);background:#eff2ff}
.layout{display:flex;gap:18px;padding:14px 18px 28px;align-items:flex-start}
.timeline{flex:1 1 0;min-width:0}.map-panel{flex:0 0 420px;position:sticky;top:12px}
#map{width:100%;height:72vh;min-height:480px;border-radius:16px;border:1px solid var(--line);z-index:1}
.map-head{padding:10px 0 8px}
.mh-title{font-weight:800;font-size:17px}.mh-sub{font-size:12px;color:var(--muted);margin-top:2px}
.day-head{font-weight:800;font-size:19px;margin:18px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--indigo)}
.day-head small{font-weight:600;font-size:13px;color:var(--muted);margin-left:8px}
.tl{display:flex;flex-direction:column;gap:10px}
.tl-card{background:#fff;border-radius:14px;padding:14px 16px;cursor:pointer;border:1px solid var(--line);transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tl-card:hover{border-color:var(--indigo);transform:translateY(-1px);box-shadow:0 4px 12px rgba(91,108,255,.12)}
.tl-card.active{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,108,255,.15)}
.tl-time{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.tl-cat{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;margin-left:8px}
.tl-name{font-weight:700;font-size:15px;margin-top:4px}.tl-en{font-size:12px;color:var(--muted);margin-top:1px}
.cat-\u666f\u70b9 .tl-cat,.cat-\u673a\u573a .tl-cat{background:var(--indigo)}.cat-\u7f8e\u98df .tl-cat{background:var(--coral)}.cat-\u6587\u5316 .tl-cat{background:var(--purple)}.cat-\u8d2d\u7269 .tl-cat{background:var(--teal)}.cat-\u9152\u5e97 .tl-cat{background:var(--slate)}
#map .leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
@media(max-width:920px){.banner{padding:26px 20px}.b-title{font-size:28px}.layout{flex-direction:column;gap:0;padding:12px 12px 24px}.timeline{width:100%}.map-panel{position:relative;top:0;width:100%;margin-top:14px}#map{height:55vh;min-height:360px}.view-switch{display:flex!important}}
@media(max-width:768px){.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:14px 14px 6px}.tabs::-webkit-scrollbar{display:none}body.m-view-list .map-panel{display:none}body.m-view-map .timeline{display:none}.map-panel{margin-top:0;border-radius:16px}#map{height:calc(100vh - 140px);min-height:unset}}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head><body>
<header class="banner"><div class="banner-inner"><h1 class="b-title">曼谷 4 日漫游</h1></div></header>
<nav class="tabs" id="tabs"></nav>
<nav class="view-switch" id="viewSwitch"><button data-view="list" class="active">\ud83d\udccb 行程列表</button><button data-view="map">\ud83d\ddfa 地图导航</button></nav>
<main class="layout">
<section class="timeline"><div class="day-head" id="day-head"></div><div class="tl" id="tl"></div></section>
<aside class="map-panel"><div class="map-head"><div><div class="mh-title" id="map-title">行程地图</div><div class="mh-sub">点击左侧卡片，地图飞抵对应地点</div></div></div><div id="map"></div></aside>
</main>
<script>
const CATS={"景点":{c:"#5B6CFF"},"美食":{c:"#FF7A59"},"文化":{c:"#9B5DE5"},"购物":{c:"#2EC4B6"},"酒店":{c:"#94a3b8"},"机场":{c:"#64748b"}};
const HOME={n:"沙吞雅诗阁大使酒店",en:"Ascott Ambassador Bangkok",lat:13.7468,lng:100.5608};
const D=[
{n:"7/17 周五",t:"抵达 → 是隆夜生活",p:[
 {tm:"06:00",c:"机场",n:"✈️ 廊曼机场 T1",en:"Don Mueang Airport (DMK)",la:13.9125,ln:100.6067},
 {tm:"07:30",c:"酒店",n:"🏨 抵达·放行李",en:"Ascott Bangkok",la:13.7468,ln:100.5608,sk:1},
 {tm:"08:30",c:"购物",n:"X One 换泰铢",en:"X One Currency Exchange",la:13.7455,ln:100.5618},
 {tm:"09:30",c:"景点",n:"是隆早市",en:"Silom Morning Market",la:13.7275,ln:100.5350},
 {tm:"12:00",c:"酒店",n:"回酒店歇脚",en:"Back to Hotel",la:13.7468,ln:100.5608,sk:1},
 {tm:"14:30",c:"文化",n:"JeySpa 按摩",en:"JeySpa",la:13.7440,ln:100.5580},
 {tm:"16:00",c:"酒店",n:"回酒店·收拾",en:"Back to Hotel",la:13.7468,ln:100.5608,sk:1},
 {tm:"17:00",c:"景点",n:"朱拉隆功夜市",en:"Chulalongkorn Night Market",la:13.7370,ln:100.5290},
 {tm:"19:30",c:"酒店",n:"回酒店·补妆",en:"Back to Hotel",la:13.7468,ln:100.5608,sk:1},
 {tm:"20:30",c:"文化",n:"ETD Bar",en:"ETD Bar",la:13.7265,ln:100.5340},
 {tm:"23:00",c:"文化",n:"DJ Station / G.O.D",en:"DJ Station · G.O.D (Silom Soi 2)",la:13.7268,ln:100.5345}]},
{n:"7/18 周六",t:"咖啡 → Krubb → club",p:[

 {tm:"11:30",c:"购物",n:"7-Eleven 补货",en:"7-Eleven Ekkamai",la:13.7200,ln:100.5820},
 {tm:"14:00",c:"美食",n:"FACTORY COFFEE",en:"FACTORY COFFEE Ekkamai",la:13.7220,ln:100.5810},

 {tm:"22:30",c:"文化",n:"DJ Station / G.O.D",en:"DJ Station · G.O.D",la:13.7268,ln:100.5345}]},
{n:"7/19 周日",t:"CW 扫货 → 桑拿 → BoyCamp",p:[
 {tm:"10:00",c:"酒店",n:"🏨 从酒店出发",en:"Leave Hotel",la:13.7468,ln:100.5608,sk:1},
 {tm:"12:00",c:"购物",n:"Central World 商圈",en:"CentralWorld",la:13.7465,ln:100.5385},
 {tm:"16:00",c:"酒店",n:"回酒店·收拾",en:"Back to Hotel",la:13.7468,ln:100.5608,sk:1},

{n:"7/20 周一",t:"水上市场 + 绵绵冰 → 机场",p:[
 {tm:"09:00",c:"酒店",n:"🏨 从酒店出发",en:"Leave Hotel",la:13.7468,ln:100.5608,sk:1},
 {tm:"10:00",c:"景点",n:"Khlong Bang Luang 水上市场",en:"Khlong Bang Luang Floating Market",la:13.7405,ln:100.4665},
 {tm:"14:30",c:"美食",n:"After You 绵绵冰",en:"After You Dessert Café Siam",la:13.7465,ln:100.5380},
 {tm:"15:30",c:"酒店",n:"🏨 回酒店·取行李退房",en:"Checkout",la:13.7468,ln:100.5608,sk:1},
 {tm:"17:00",c:"机场",n:"✈️ 廊曼机场 T1",en:"Don Mueang Airport DMK",la:13.9125,ln:100.6067}]}
];
let map=null,dL=null,cD=0;
function pI(c,n){const s='<svg xmlns="http://www.w3.org/2000/svg" width="32" height="42" viewBox="0 0 32 42"><path d="M16 41 C16 41 2 26 2 16 A14 14 0 1 1 30 16 C30 26 16 41 16 41 Z" fill="'+c+'"/><circle cx="16" cy="16" r="11" fill="#fff"/><text x="16" y="21" font-size="14" font-weight="700" fill="'+c+'" text-anchor="middle">'+n+'</text></svg>';return L.divIcon({html:s,className:'',iconSize:[32,42],iconAnchor:[16,42],popupAnchor:[0,-40]});}
function hI(){return L.divIcon({html:'<svg xmlns="http://www.w3.org/2000/svg" width="34" height="44" viewBox="0 0 34 44"><path d="M17 43 C17 43 3 27 3 17 A14 14 0 1 1 31 17 C31 27 17 43 17 43 Z" fill="#1a2b4a"/><circle cx="17" cy="17" r="12" fill="#fff"/><text x="17" y="23" font-size="16" text-anchor="middle">\ud83c\udfe0</text></svg>',className:'',iconSize:[34,44],iconAnchor:[17,44],popupAnchor:[0,-40]});}
function iH(p){const c=CATS[p.c].c;return'<div style="font:600 14px/1.4 sans-serif;min-width:160px"><div style="font-weight:800">#0a1f44">'+p.n+'</div><div style="color:#5b6b8c;font-size:11px;margin:2px 0">'+p.en+'</div><span style="background:'+c+';#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px">'+p.c+' · '+p.tm+'</span></div>';}
function rT(){const e=document.getElementById("tabs");D.forEach((d,i)=>{const b=document.createElement("button");b.className="tab"+(i?"":" active");b.innerHTML=d.n+'<small>'+d.t.split("→")[0]+"</small>";b.onclick=()=>sD(i);e.appendChild(b);});}
function rTL(di){const d=D[di];document.getElementById("day-head").innerHTML="<span>"+d.n+"</span> <small>"+d.t+"</small>";const tl=document.getElementById("tl");tl.innerHTML="";d.p.forEach((p,idx)=>{const c=document.createElement("div");c.className="tl-card cat-"+p.c;c.dataset.idx=idx;c.innerHTML='<div><span class="tl-time">'+p.tm+"</span><span class='tl-cat'>"+p.c+'</span></div><div class="tl-name">'+p.n+'</div><div class="tl-en">'+p.en+"</div>";c.onclick=()=>fP(di,idx);tl.appendChild(c);});}
function rDM(di){if(!map)return;if(dL)map.removeLayer(dL);dL=L.layerGroup().addTo(map);d.p.forEach((p,idx)=>{if(p.sk)return;const m=L.marker([p.la,p.ln],{icon:pI(CATS[p.c].c,idx+1)});m.on("click",()=>fP(di,idx));dL.addLayer(m);});L.marker([HOME.lat,HOME.lng],{icon:hI()}).bindPopup('<div style="font:600 14px/1.4 sans-serif"><b>\ud83c\udfe0 '+HOME.n+'</b><br><span style="color:#5b6b8c;font-size:11px">'+HOME.en+"</span></div>").addTo(dL);const rc=d.p.filter(p=>!p.sk).map(p=>[p.la,p.ln]);if(rc.length>=2)L.polyline(rc,{color:"#c0c8d8",weight:3,opacity:.6}).addTo(dL);fF(d.p.filter(p=>!p.sk));}
function fF(ps){if(!ps.length)return;const la=ps.map(p=>p.la),ln=ps.map(p=>p.ln);map.fitBounds([[Math.min(...la),Math.min(...)],[Math.max(...la),Math.max(...ln)]],{padding:[50,50]});}
function sD(i,noS){cD=i;document.querySelectorAll(".tab").forEach((t,j)=>t.classList.toggle("active",j===i));rTL(i);rDM(i);document.getElementById("map-title").textContent=D[i].n+" · "+D[i].t.split("→")[0];if(map&&innerWidth<=768)setTimeout(()=>{try{map.invalidateSize(true);}catch(e){}},200);}
function fP(di,idx){if(di!==cD)sD(di,true);const p=D[di].p[idx];const m=matchMedia("(max-width:768px)").matches;
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(p.en).then(()=>{const t=document.createElement("div");t.textContent="\u2705 已复制："+p.en;t.style.cssText="position:fixed;bottom:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);#fff;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:700;z-index:9999;animation:fadeUp .35s ease";document.body.appendChild(t);setTimeout(()=>{t.style.opacity="0";setTimeout(()=>t.remove(),350);},900);}).catch(()=>{});}
if(map){if(m&&!document.body.classList.contains("m-view-map"))setMV("map");if(dL)dL.eachLayer(l=>{if(l._rh)dL.removeLayer(l);});if(idx>0){const pp=D[di].p.slice(0,idx+1).filter(x=>!x.sk);if(pp.length>=2){const rl=L.polyline(pp.map(x=>[x.la,x.ln]),{color:"#ff2d55",weight:5,opacity:.95,dashArray:"10,6"});rl._rh=true;dL.addLayer(rl);}}map.flyTo([p.la,p.ln],15,{duration:.8});L.popup({offset:[0,-40],closeButton:true}).setLatLng([p.la,p.ln]).setContent(iH(p)).openOn(map);}document.querySelectorAll(".tl-card").forEach(c=>c.classList.remove("active"));const cd=document.querySelector('.tl-card[data-idx="'+idx+'"]');if(cd){cd.classList.add("active");if(!m)cd.scrollIntoView({behavior:"smooth",block:"center"});}}
function setMV(v){document.body.classList.remove("m-view-list","m-view-map");document.body.classList.add(v==="map"?"m-view-map":"m-view-list");document.querySelectorAll("#viewSwitch button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));if(v==="map"){try{if(map)map.invalidateSize(true);}catch(e){}setTimeout(()=>{try{fF(D[cD].p.filter(p=>!p.sk));}catch(e){}},250);}}
(function(){rT();map=L.map("map",{scrollWheelZoom:true,zoomControl:false}).setView([13.74,100.54],12);L.control.zoom({position:'topright'}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; CARTO',subdomains:'abcd',maxZoom:20}).addTo(map);sD(0,true);document.querySelectorAll("#viewSwitch button").forEach(b=>b.addEventListener("click",()=>setMV(b.dataset.view)));})();
</script></body></html>
