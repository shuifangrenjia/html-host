<style>

*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{font:14px/1.6 -apple-system,'PingFang SC',sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;min-height:100vh;background:transparent}

 radial-gradient(42vw 42vw at 16% 86%, rgba(210,190,255,.20), transparent 60%);
 filter:blur(8px)}
/* ---------- Banner (no photo, gradient only) ---------- */
.banner{position:relative;padding:46px 24px 40px;color:#fff;text-align:center;border-radius:0 0 30px 30px;overflow:hidden;background:linear-gradient(135deg,#1e293b,#0f172a)}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,.18) 0%,rgba(15,23,42,.50) 60%,rgba(15,23,42,.78) 100%)}
.banner-inner{position:relative;z-index:1;max-width:900px;margin:0 auto}
.b-eyebrow{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--gold);margin-bottom:10px}
.b-title{font-size:36px;font-weight:900;letter-spacing:-.5px;line-height:1.25;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.b-meta{margin-top:12px;display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:rgba(255,255,255,.82)}
.b-meta .dot{width:4px;height:4px;border-radius:50%;background:var(--gold)}
/* ---------- Overview ---------- */
.overview{max-width:1100px;margin:18px auto 0;padding:0 18px}
.ov-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.ov-title{font-size:22px;font-weight:900;color:var(--ink)}
.ov-sub{font-size:13px;color:var(--muted);font-weight:600}
.ov-stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.ov-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ov-stat b{font-size:17px;font-weight:900;color:var(--indigo)}
.ov-stat span{font-size:12px;color:var(--muted);margin-left:5px}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ov-chip{text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ov-chip:hover{border-color:var(--indigo);transform:translateY(-1px);box-shadow:0 4px 12px rgba(91,108,255,.12)}
.ov-chip.active{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,108,255,.15)}
.ov-d{font-size:12px;font-weight:800;color:var(--muted)}
.ov-t{font-size:14px;font-weight:800;color:var(--ink);margin:3px 0 6px;line-height:1.3}
.ov-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef1ff;color:var(--indigo)}
@media(max-width:920px){.overview{padding:0 12px}.ov-title{font-size:19px}}
/* ---------- Tabs ---------- */
.tabs{display:flex;gap:10px;padding:20px 18px 4px;flex-wrap:wrap}
.tab{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted);padding:11px 18px;border-radius:14px;font-size:15px;font-weight:700;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tab:hover{transform:translateY(-1px)}
.tab.active{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--indigo),var(--purple));box-shadow:0 6px 18px rgba(91,108,255,.35)}

.view-switch{display:none;position:sticky;top:0;z-index:600;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);padding:10px 14px;gap:8px}
.view-switch button{flex:1;padding:11px 8px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;transition:.15s}
.view-switch button.active{border-color:var(--indigo);color:var(--indigo);background:#eef1ff;box-shadow:0 2px 8px rgba(91,108,255,.18)}

.layout{display:flex;gap:18px;padding:14px 18px 28px;align-items:flex-start}
.timeline{flex:1 1 0;min-width:0}.map-panel{flex:0 0 420px;position:sticky;top:12px}

.map-head{padding:10px 2px 8px}
.mh-title{font-weight:800;font-size:17px}
.day-head{font-weight:800;font-size:19px;margin:18px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--indigo)}
.tl{display:flex;flex-direction:column;gap:11px}
.tl-card{position:relative;background:#fff;border-radius:14px;padding:13px 16px 13px 18px;cursor:pointer;border:1px solid var(--line);transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden}
.tl-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--slate)}
.tl-card.cat-景点::before,.tl-card.cat-机场::before{background:var(--indigo)}
.tl-card.cat-美食::before{background:var(--coral)}
.tl-card.cat-文化::before{background:var(--purple)}

.tl-card.cat-酒店::before,.tl-card.cat-其它::before{background:var(--slate)}
.tl-card:hover{border-color:var(--indigo);transform:translateY(-1px);box-shadow:0 4px 12px rgba(91,108,255,.12)}
.tl-card.active{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,108,255,.15)}
.tl-time{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.tl-cat{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;margin-left:8px}
.tl-name{font-weight:700;font-size:15px;margin-top:4px}.tl-en{font-size:12px;color:var(--muted);margin-top:1px}
#map .leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
@media(max-width:920px){.banner{padding:38px 20px 32px}.b-title{font-size:28px}.layout{flex-direction:column;gap:0;padding:12px 12px 24px}.timeline{width:100%}.map-panel{position:relative;top:0;width:100%;margin-top:14px}#map{height:55vh;min-height:360px}.view-switch{display:flex!important}}
@media(max-width:768px){.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:14px 14px 6px}.tabs::-webkit-scrollbar{display:none}body.m-view-list .map-panel{display:none!important}body.m-view-map .timeline{display:none!important}.map-panel{margin-top:0;border-radius:16px}#map{height:calc(100vh - 132px);min-height:unset}}

function renderOverview(){document.getElementById("day-head").innerHTML='<span>📋 行程一览</span> <small style="color:var(--muted);font-weight:600;font-size:13px;margin-left:8px">13 天 · 6 城 · 4 次跨境</small>';const tl=document.getElementById("tl");tl.innerHTML='<div class="ov-stats" style="display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px"><div class="ov-stat" style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)"><b style="font-size:17px;font-weight:900;color:var(--indigo)">13</b><span style="font-size:12px;color:var(--muted);margin-left:5px">天</span></div><div class="ov-stat" style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)"><b style="font-size:17px;font-weight:900;color:var(--indigo)">6</b><span style="font-size:12px;color:var(--muted);margin-left:5px">城</span></div><div class="ov-stat" style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)"><b style="font-size:17px;font-weight:900;color:var(--indigo)">4</b><span style="font-size:12px;color:var(--muted);margin-left:5px">次跨境</span></div></div><div class="ov-grid" id="ovGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px"></div>';const g=document.getElementById("ovGrid");D.forEach((d,i)=>{if(/灵活|欢送/.test(d.t))return;const tag=/香港|澳门|珠海/.test(d.t)?"🌉 跨境":/广州|顺德/.test(d.t)?"🚄 出城":/迪士尼|长隆/.test(d.t)?"🎡 游玩":"🏠 深圳";const c=document.createElement("button");c.className="ov-chip";c.style.cssText="text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.04)";c.innerHTML='<div style="font-size:12px;font-weight:800;color:var(--muted)">'+d.n+'</div><div style="font-size:14px;font-weight:800;color:var(--ink);margin:3px 0 6px;line-height:1.3">'+d.t.split("·")[0].trim()+'</div><div style="display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef1ff;color:var(--indigo)">'+tag+'</div>';c.onclick=()=>sD(i);g.appendChild(c);});}
function rTL(di){const d=D[di];document.getElementById("day-head").innerHTML="<span>"+d.n+"</span> <small style=\"color:var(--muted);font-weight:600;font-size:13px;margin-left:8px\">"+d.t+"</small>";const tl=document.getElementById("tl");tl.innerHTML="";d.p.forEach((p,idx)=>{const c=document.createElement("div");c.className="tl-card cat-"+p.c;c.dataset.idx=idx;c.innerHTML='<div><span class="tl-time">'+p.tm+"</span><span class='tl-cat' style=\"background:"+cc(p)+"\">"+ci(p)+" "+p.c+'</span></div><div class="tl-name">'+p.n+'</div><div class="tl-en">'+p.en+"</div>";c.onclick=()=>fP(di,idx);tl.appendChild(c);});}
function rDM(di){if(!map)return;const d=D[di];if(dL)map.removeLayer(dL);dL=L.layerGroup().addTo(map);d.p.forEach((p,idx)=>{if(p.sk)return;const m=L.marker([p.la,p.ln],{icon:pI(p,idx)});m.on("click",()=>fP(di,idx));dL.addLayer(m);});L.marker([HOME.lat,HOME.lng],{icon:hI()}).bindPopup('<div style="font:600 14px/1.4 sans-serif"><b>🏠 '+HOME.n+'</b><br><span style="color:#5b6b8c;font-size:11px">'+HOME.en+"</span></div>").addTo(dL);const rc=d.p.filter(p=>!p.sk).map(p=>[p.la,p.ln]);if(rc.length>=2)L.polyline(rc,{color:"#c0c8d8",weight:3,opacity:.6}).addTo(dL);fF(d.p.filter(p=>!p.sk));}
function fF(ps){if(!ps.length)return;const la=ps.map(p=>p.la),ln=ps.map(p=>p.ln);map.fitBounds([[Math.min(...la),Math.min(...ln)],[Math.max(...la),Math.max(...ln)]],{padding:[50,50]});}
function sD(i){cD=i;document.querySelectorAll(".tab").forEach((t,j)=>t.classList.toggle("active",j===i+1));if(i===-1){renderOverview();document.getElementById("map-title").textContent="行程总览";const rp=document.getElementById("routePanel");if(rp)rp.style.display="none";if(map&&innerWidth<=768)setTimeout(()=>{try{map.invalidateSize(true);}catch(e){}},200);return;}rTL(i);rDM(i);document.getElementById("map-title").textContent=D[i].n+" · "+D[i].t.split("·")[0];const rp=document.getElementById("routePanel");if(rp)rp.style.display="none";if(map&&innerWidth<=768)setTimeout(()=>{try{map.invalidateSize(true);}catch(e){}},200);}
function fP(di,idx){if(di!==cD)sD(di);const p=D[di].p[idx];const m=matchMedia("(max-width:768px)").matches;
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(p.n).catch(()=>{});}
 if(map){if(m&&!document.body.classList.contains("m-view-map"))setMV("map");if(!p.sk){const prev=D[di].p.slice(0,idx).filter(x=>!x.sk);const bnd=(prev.length>0)?[[prev[prev.length-1].la,prev[prev.length-1].ln],[p.la,p.ln]]:[[HOME.lat,HOME.lng],[p.la,p.ln]];map.flyToBounds(bnd,{padding:[42,42],maxZoom:17,duration:.8});L.popup({offset:[0,-40],closeButton:true}).setLatLng([p.la,p.ln]).setContent(iH(p)).openOn(map);}renderPanel(p);}
 document.querySelectorAll(".tl-card").forEach(c=>c.classList.remove("active"));const cd=document.querySelector('.tl-card[data-idx="'+idx+'"]');if(cd){cd.classList.add("active");if(!m)cd.scrollIntoView({behavior:"smooth",block:"center"});}}
function renderPanel(p){const rp=document.getElementById("routePanel");if(!rp)return;rp.style.display="block";const addr=p.en||p.n;
 rp.innerHTML='<div class="route-detail"><div>'+p.n+'</div></div><div class="route-soft">📍 '+addr+'</div>'+
  '<div class="route-actions"><a class="nav" href="'+amapNavUrl(p)+'" target="_blank" rel="noopener">🧭 高德导航</a>'+
  '<span class="route-keyhint" onclick="copyAddr(\''+addr.replace(/'/g,"\\'")+'\')">📋 复制</span></div>';}
function copyAddr(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{});}
function setMV(v){const toMap=(v==="map");document.body.classList.toggle("m-view-map",toMap);document.body.classList.toggle("m-view-list",!toMap);document.querySelectorAll("#viewSwitch button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));if(toMap){setTimeout(()=>{try{map.invalidateSize(true);fF(D[cD].p.filter(p=>!p.sk));}catch(e){}},220);}window.scrollTo({top:0,behavior:"smooth"});}
(function(){rT();map=L.map("map",{scrollWheelZoom:true,zoomControl:false}).setView([22.54,114.06],11);L.control.zoom({position:'topright'}).addTo(map);L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{attribution:'© 高德地图 AutoNavi',subdomains:'1234',maxZoom:20}).addTo(map);sD(-1);document.querySelectorAll("#viewSwitch button").forEach(b=>b.addEventListener("click",()=>setMV(b.dataset.view)));})();
</script></body></html>
