<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QQ浏览器首页 · 看世界双列 ｜ 高保真原型</title>
<style>
/* ============================================================
   视觉系统（沿用看世界，配合 QB 首页底色）
   ============================================================ */
:root{
  --page:#F2F3F5; --card:#FFFFFF; --brand:#FF6B35; --link:#2B6CB0;
  --t1:#1A1A1E; --t2:#5A5A66; --t3:#9A9AA6; --line:#EDEEF0;
  --r-card:12px; --r-btn:12px; --safe-b:34px;
  --mono:ui-monospace,Menlo,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#2C2C2E 0%,#1C1C1E 100%);color:var(--t1);font-size:15px;line-height:1.5;overflow:hidden;
}
button{font-family:inherit;border:0;background:none;padding:0;color:inherit;cursor:pointer}
a{color:var(--link);text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.tap{transition:opacity .16s ease,transform .16s ease}
.tap:active{opacity:.6;transform:scale(.98)}

/* ============ iPhone 外壳 ============ */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:40px 20px;overflow:auto}
#phone{position:relative;width:393px;height:852px;flex:0 0 auto;border-radius:56px;background:#08080A;
  border:2px solid #101014;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06)}
#screen{position:absolute;inset:0;border-radius:54px;overflow:hidden;background:var(--page)}
#island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;
  background:#000;z-index:1090;pointer-events:none}
#island::after{content:"";position:absolute;right:13px;top:12.5px;width:12px;height:12px;border-radius:99px;background:#0E1418}
#statusbar{position:absolute;left:0;right:0;top:0;height:54px;z-index:1080;pointer-events:none;display:flex;
  align-items:center;justify-content:space-between;padding:0 30px 0 32px;color:var(--t1);transition:color .25s ease}
#statusbar.light{color:#fff}
#statusbar .stime{font-size:17px;font-weight:700;letter-spacing:.2px;padding-top:2px}
#statusbar .sright{display:flex;align-items:center;gap:6px;padding-top:2px}
#homeind{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;
  background:rgba(0,0,0,.3);z-index:1075;pointer-events:none}

/* ============ 底部 Tab Bar（QB 五格） ============ */
#tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;padding-bottom:var(--safe-b);z-index:940;display:flex;
  align-items:flex-start;background:rgba(255,255,255,.92);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 .5px 0 rgba(0,0,0,.1)}
#tabbar button{flex:1 1 0;height:49px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#9A9AA6}
#tabbar button.on{color:var(--t1)}
#tabbar span{font-size:10px;font-weight:500}
#tabbar .num{position:absolute;font-size:8.5px;font-weight:700;margin-top:-3px}
#tabbar button:active{opacity:.55}

/* ============ 页面容器 ============ */
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:83px;
  opacity:0;visibility:hidden;transition:opacity .18s ease,visibility .18s;background:var(--page)}
.page.on{opacity:1;visibility:visible}
.page::-webkit-scrollbar{display:none}
.blank{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--t3);padding-bottom:120px}
.blank b{font-size:15px;color:var(--t2);font-weight:600}
.blank i{font-size:12px;font-style:normal}

/* ============ QB 首页顶部 ============ */
#sbbg{position:absolute;left:0;right:0;top:0;height:54px;z-index:70;background:rgba(242,243,245,.94);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);opacity:0;transition:opacity .2s ease;pointer-events:none}
#sbbg.on{opacity:1}
.qbtop{padding:54px 16px 0;background:linear-gradient(180deg,#F7F8FA 0%,#F2F3F5 100%)}
.qbrow1{height:46px;display:flex;align-items:center}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#3A3A42}
.qblogo{text-align:center;font-size:26px;font-weight:800;letter-spacing:.5px;padding:16px 0 18px;color:#17171B}
.qbsearch{height:48px;border-radius:24px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 16px 0 18px;
  box-shadow:0 1px 3px rgba(0,0,0,.05)}
.qbsearch .ph{flex:1 1 auto;font-size:15.5px;color:#A2A2AC}
.qbbtns{display:flex;gap:12px;margin-top:12px}
.qbbtn{flex:1 1 0;height:44px;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:14px;font-weight:500;color:#33333B;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.qblinks{display:flex;gap:0;margin:18px 0 16px}
.qblink{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.qblink .ico{width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center;
  box-shadow:0 1px 3px rgba(0,0,0,.05);font-size:20px;font-weight:700}
.qblink .ico.add{background:rgba(255,255,255,.5);box-shadow:none;border:1px dashed #D6D7DC;color:#A2A2AC;font-weight:400}
.qblink span{font-size:11px;color:#5A5A66}

/* ============ 内容面板 + 频道条 ============ */
.panel{background:#F2F3F5;border-radius:16px 16px 0 0;min-height:640px;padding-bottom:24px}
.chbar{position:sticky;top:54px;z-index:60;background:rgba(242,243,245,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:16px 16px 0 0;
  display:flex;align-items:center;gap:2px;padding:0 6px;height:46px;box-shadow:inset 0 -.5px 0 rgba(0,0,0,.06)}
.chbar button{position:relative;flex:0 0 auto;height:46px;padding:0 10px;font-size:15px;color:var(--t2);font-weight:400;white-space:nowrap}
.chbar button.on{font-size:17px;font-weight:700;color:var(--t1)}
.chbar button.on::after{content:"";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:18px;height:3px;
  border-radius:999px;background:var(--brand)}
.chbar .grow{flex:1 1 auto}
.chbar .more{color:var(--t3);padding-right:6px}

/* ============ 热点话题：App Store 主打推荐式横向卡 ============ */
.thead{display:flex;align-items:center;gap:6px;padding:12px 14px 8px}
.thead b{font-size:17px;font-weight:700;letter-spacing:-.3px}
.thead .live{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:4px;
  background:#FFF1EA;color:var(--brand);font-size:9.5px;font-weight:700}
.thead .live i{width:5px;height:5px;border-radius:99px;background:var(--brand);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.thead .upd{margin-left:auto;font-size:10.5px;color:var(--t3);font-variant-numeric:tabular-nums}
.trail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:0 14px 14px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.trail::-webkit-scrollbar{display:none}
.tcard{position:relative;flex:0 0 auto;width:300px;scroll-snap-align:center;text-align:left;
  display:block;transition:transform .2s cubic-bezier(.32,.72,0,1)}
.tcard:active{transform:scale(.978)}
.tcard .thero{border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.07),0 10px 26px rgba(0,0,0,.13)}
.tcard .thero::before{height:60px;border-radius:18px 18px 0 0;background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,0))}
/* 图内底部毛玻璃条 */
.tbar{position:absolute;left:8px;right:8px;bottom:8px;z-index:4;height:56px;padding:8px;border-radius:13px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  display:flex;align-items:center;gap:9px;box-shadow:0 1px 6px rgba(0,0,0,.12)}
.tcard .tico{width:40px!important;height:40px;flex:0 0 auto;border-radius:9px;overflow:hidden;aspect-ratio:1/1!important;
  box-shadow:0 1px 3px rgba(0,0,0,.22)}
.tcard .tico::before{display:none}
.tinfo{min-width:0;flex:1 1 auto}
.tinfo b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;color:#16161A;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tinfo .tn{display:block;margin-top:2px;font-size:10.5px;line-height:1.3;color:#5A5A66;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgo{flex:0 0 auto;height:28px;padding:0 14px;border-radius:999px;background:rgba(255,107,53,.14);
  color:#D2551F;font-size:13px;font-weight:700;display:inline-flex;align-items:center}

/* ============ 下拉刷新 ============ */
.ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--t3);font-size:12.5px}
.ptr.anim{transition:height .32s cubic-bezier(.32,.72,0,1)}
.spin{width:16px;height:16px;border-radius:99px;border:2px solid rgba(0,0,0,.12);border-top-color:var(--brand);animation:sp .7s linear infinite}
@keyframes sp{100%{transform:rotate(360deg)}}

/* ============ 双列瀑布流（App Store 风格白卡） ============ */
.feed{display:flex;gap:11px;padding:2px 14px 20px;align-items:flex-start}
.colm{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:12px}
.qcard{position:relative;background:#fff;border-radius:16px;overflow:hidden;opacity:0;transform:translateY(10px);
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.07);
  transition:opacity .38s ease,transform .38s cubic-bezier(.32,.72,0,1)}
.qcard.in{opacity:1;transform:none}
.qcard:active{opacity:.86;transform:scale(.985)}
.qcard.fresh .qtitle::after{content:"新";display:inline-block;margin-left:5px;font-size:9px;color:#fff;background:var(--brand);
  border-radius:4px;padding:1px 3px;vertical-align:2px;font-weight:700}
/* 图片 */
.cimg{position:relative;width:100%;overflow:hidden;background:#EDEEF0;border-radius:var(--r-card);display:block}
.qcard>.cimg{border-radius:16px 16px 0 0}
.cimg img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s ease}
.cimg img.loaded{opacity:1}
.cimg .shim{position:absolute;inset:0;background:#EDEEF0;overflow:hidden}
.cimg .shim::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.7),rgba(255,255,255,0));animation:shim 1.2s infinite}
@keyframes shim{100%{transform:translateX(100%)}}
.cimg.img-fallback img,.cimg.img-fallback .shim{display:none}
.cimg.img-fallback{background:linear-gradient(135deg,#E7E9EC 0%,#D7DAE0 52%,#EEF0F3 100%)}
.cimg.img-fallback::after{content:attr(data-emoji);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;opacity:.85}
.cimg::before{content:"";position:absolute;left:0;right:0;top:0;height:52px;border-radius:var(--r-card) var(--r-card) 0 0;
  background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,0))}
.playbig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:34px;height:34px;border-radius:99px;
  background:rgba(0,0,0,.42);backdrop-filter:blur(4px);display:grid;place-items:center}
.mtag{position:absolute;right:7px;bottom:7px;z-index:3;height:19px;padding:0 6px;border-radius:5px;background:rgba(0,0,0,.5);
  color:#fff;font-size:10px;font-weight:600;display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
/* 文字区（只保留标题 + 小来源，外层不露出 AI 结论 / 亮评 / 互动数据） */
.qbody{padding:9px 11px 11px}
.qtitle{font-size:14.5px;font-weight:600;line-height:1.4;letter-spacing:-.2px;color:#16161A;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qtitle.sm{font-size:13px;font-weight:500;color:#3A3A44;line-height:1.45}
.qtitle.big{font-size:16px;font-weight:700;line-height:1.34;-webkit-line-clamp:3;margin-top:6px}
/* 文字大字卡（图位即排版） */
.poster{padding:12px 12px 11px;min-height:120px;display:flex;flex-direction:column}
.poster .prow{display:flex;align-items:center;gap:5px;font-size:11px;color:#2A2A32;font-weight:700}
.poster .prow .ptag{margin-left:auto;font-style:normal;font-size:9.5px;font-weight:600;color:#5A5A66;
  background:rgba(255,255,255,.72);border-radius:999px;padding:2px 7px}
.poster .pbig{margin-top:10px;font-size:19px;font-weight:800;line-height:1.32;letter-spacing:-.4px;color:#111116;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.poster .pfoot{margin-top:auto;padding-top:10px;font-size:10px;color:#6A6A76;font-variant-numeric:tabular-nums}
.t-violet{background:#EFEBFF}.t-green{background:#E8F4EA}.t-yellow{background:#FDF3D8}
.t-blue{background:#E7F0FE}.t-pink{background:#FDECEF}.t-mint{background:#E4F4F1}
/* AI 聚合卡 */
.agtag{position:absolute;left:8px;top:8px;z-index:3;height:20px;padding:0 8px;border-radius:999px;
  background:rgba(20,20,26,.62);backdrop-filter:blur(10px);color:#fff;font-size:9.5px;font-weight:700;
  display:inline-flex;align-items:center;letter-spacing:.2px}
.agfoot{margin-top:0!important;margin-bottom:2px}
.pstack{display:inline-flex;align-items:center;flex:0 0 auto}
.pstack i{display:inline-flex;width:15px;height:15px;border-radius:5px;overflow:hidden;background:#fff;
  box-shadow:0 0 0 1.4px #fff;margin-left:-5px}
.pstack i:first-child{margin-left:0}
.agstat{margin-top:8px;font-size:11px;font-weight:700;color:var(--link)}
.ai-chip{position:absolute;right:4px;top:4px;height:12px;padding:0 3px;border-radius:3px;background:rgba(255,107,53,.14);
  color:#C4491C;font-size:8px;font-weight:700;display:inline-flex;align-items:center}
/* 底部来源行（铁律一：平台 + 原作者常驻） */
.qfoot{display:flex;align-items:center;gap:4px;margin-top:7px;min-width:0}
.qfoot svg{flex:0 0 auto}
.ava{width:18px;height:18px;border-radius:999px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:700}
.qauth{font-size:10.5px;color:var(--t3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qlike{margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;color:#9A9AA6;
  font-size:10.5px;font-variant-numeric:tabular-nums}
/* 骨架 / 触底 */
.sk{border-radius:16px;overflow:hidden;background:#fff;padding-bottom:10px;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.07)}
.sk .m{background:#EDEEF0;position:relative;overflow:hidden;border-radius:16px 16px 0 0}
.sk .l{height:12px;border-radius:5px;margin:8px 11px 0;background:#EDEEF0;position:relative;overflow:hidden}
.sk .m::after,.sk .l::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.7),rgba(255,255,255,0));animation:shim 1.2s infinite}
.loadmore{display:flex;justify-content:center;padding:16px 0}
.endtip{text-align:center;padding:18px 24px 6px;font-size:11px;color:var(--t3);line-height:1.7}
.endtip b{display:block;font-size:12.5px;color:var(--t2);margin-bottom:3px}
.emptytip{text-align:center;padding:48px 32px;color:var(--t3);font-size:12.5px;line-height:1.8}
.emptytip b{display:block;font-size:14px;color:var(--t2);margin-bottom:6px}

/* ============ Push 页 ============ */
.push{position:absolute;inset:0;z-index:945;background:#fff;transform:translateX(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column}
.push.on{transform:translateX(0)}
.pnav{position:absolute;left:0;right:0;top:0;height:98px;padding:54px 10px 0;z-index:70;display:flex;align-items:center;gap:2px;
  color:#fff;background:transparent;transition:background .25s ease,color .25s ease,box-shadow .25s ease}
.pnav.solid{background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:var(--t1);box-shadow:0 .5px 0 rgba(0,0,0,.08)}
.pnav .back{display:inline-flex;align-items:center;height:40px;padding:0 6px;color:inherit}
.pnav .ptitle{flex:1 1 auto;min-width:0;text-align:center;font-size:15.5px;font-weight:600;opacity:0;transition:opacity .2s;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnav.solid .ptitle{opacity:1}
.pnav .navico{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;color:inherit;flex:0 0 auto}
.pscroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pscroll::-webkit-scrollbar{display:none}
/* 详情内容 */
.hero{position:relative;width:100%;aspect-ratio:16/9;background:#E7E9EC;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
.hero img.loaded{opacity:1}
.hero.img-fallback{background:linear-gradient(135deg,#E7E9EC,#D7DAE0 52%,#EEF0F3)}
.hero.img-fallback img{display:none}
.hero.img-fallback::after{content:attr(data-emoji);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;opacity:.85}
.hero .playbig{width:52px;height:52px}
.hero .mtag{right:14px;bottom:14px;height:22px;font-size:11px}
/* ① 作者行（置顶）：平台 / 原作者 / 原发布时间 / 回原站 */
.dauthor{display:flex;gap:9px;align-items:center;padding:8px 16px 12px}
.dauthor .ava{width:34px;height:34px;font-size:13px}
.dauthor .m{min-width:0;flex:1 1 auto}
.dauthor .nm{font-size:14.5px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dauthor .ot{font-size:11px;color:var(--t3);margin-top:2px;display:flex;align-items:center;gap:4px}
.dauthor .go{flex:0 0 auto;height:30px;padding:0 13px;border-radius:999px;background:#FFF1EA;color:var(--brand);font-size:12.5px;font-weight:700;
  display:inline-flex;align-items:center;gap:3px}
/* 话题全屏页 */
.subbtn{flex:0 0 auto;height:30px;padding:0 15px;border-radius:999px;border:1.4px solid var(--brand);color:var(--brand);
  background:#fff;font-size:13px;font-weight:700}
.subbtn.on{background:#F2F3F5;border-color:transparent;color:var(--t3)}
.subbtn:active{opacity:.6}
.thero2{position:relative;margin:0 14px 12px;border-radius:16px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 22px rgba(0,0,0,.1)}
.thero2 .cimg{border-radius:16px}
.thero2 .tmeta{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:26px 14px 12px;color:#fff;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.72))}
.thero2 .tmeta b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.thero2 .tmeta span{display:block;margin-top:3px;font-size:11px;color:rgba(255,255,255,.86)}
.din{padding:16px}
.dh1{font-size:21px;font-weight:700;line-height:1.36;letter-spacing:-.3px}
.dh1en{font-size:12px;color:var(--t3);line-height:1.5;margin-top:7px;font-style:italic}
.dconcl{margin-top:13px;position:relative;padding:11px 40px 11px 13px;border-radius:10px;background:#FFF4EE;font-size:13.5px;
  font-weight:600;line-height:1.55}
.dconcl::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:999px;background:var(--brand)}
/* 详情页正文（短的直出，不加壳） */
.dtext{margin-top:14px}
.dtext p{margin:0 0 13px;font-size:15.5px;line-height:1.82;color:#25252C}
.dtext p:last-child{margin-bottom:0}
.dtext.rawon p{font-family:Georgia,"Times New Roman",serif}
.dmore{display:inline-flex;align-items:center;gap:5px;margin-top:14px;height:36px;padding:0 15px;border-radius:999px;

  font-variant-numeric:tabular-nums}

.srcitem .m{min-width:0;flex:1 1 auto}
.srcitem .top{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--t3)}
.srcitem .tt{display:block;margin-top:3px;font-size:13px;font-weight:600;color:#25252C;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.srcitem .goto{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--link);margin-top:2px}
.agnote{margin:20px 0 6px;font-size:10.5px;color:var(--t3);line-height:1.7}
/* 来源浮层 */
.refpop{position:absolute;left:16px;right:16px;z-index:80;opacity:0;transform:translateY(-6px);pointer-events:none;

.refpop.on{opacity:1;transform:none;pointer-events:auto}
.rp-in{background:#fff;border-radius:12px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.06)}
.rp-in .tt{font-size:13.5px;font-weight:600;line-height:1.45;color:#25252C}
.rp-in .mt{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:10.5px;color:var(--t3)}
.rp-go{display:inline-block;margin-top:9px;font-size:12px;font-weight:700;color:var(--link);text-decoration:none}
/* 模块标题 */
.dsect{display:flex;align-items:center;gap:7px;margin:22px 0 10px}
.dsect h3{margin:0;font-size:16px;font-weight:700}
.dsect .sub{font-size:10.5px;color:var(--t3);font-weight:500}
.dsect .rt{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.swbtn{height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--line);font-size:10.5px;font-weight:600;color:var(--t2);
  background:#fff;display:inline-flex;align-items:center;gap:4px}
.swbtn.on{border-color:var(--brand);color:var(--brand);background:#FFF6F2}
/* 优质评论 */
.cmt{display:flex;gap:9px;padding:11px 0;box-shadow:inset 0 -.5px 0 var(--line)}
.cmt:last-child{box-shadow:none}
.cmt .no{flex:0 0 18px;height:18px;border-radius:5px;background:#FFF1EA;color:var(--brand);font-size:10.5px;font-weight:800;
  display:grid;place-items:center;margin-top:2px}
.cmt .m{min-width:0;flex:1 1 auto}
.cmt .u{font-size:11px;color:var(--t3);font-weight:600;display:flex;align-items:center;gap:6px}
.cmt .en{font-size:11.5px;color:var(--t3);line-height:1.5;font-style:italic;margin-top:4px}
.cmt .zh{font-size:14px;color:#25252C;line-height:1.6;margin-top:4px;font-weight:500}
.cmt .lk{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:10.5px;color:#9A9AA6;
  margin-top:6px;font-variant-numeric:tabular-nums}
/* 垂类结构化卡 */
.speccard{display:flex;margin-top:13px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.speccard div{flex:1 1 0;padding:10px 8px;text-align:center;box-shadow:inset -.5px 0 0 var(--line)}
.speccard div:last-child{box-shadow:none}
.speccard b{display:block;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.speccard span{display:block;font-size:10px;color:var(--t3);margin-top:3px}
.speccard b.good{color:#2F9E63}.speccard b.bad{color:#C53030}.speccard b.mid{color:#B87A1B}
/* 底部固定条（铁律二） */
.dact{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:9px 16px calc(var(--safe-b) - 10px);
  background:rgba(255,255,255,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 -.5px 0 var(--line)}
.btn-main{flex:0 0 66%;height:50px;border-radius:var(--r-btn);background:var(--brand);color:#fff;font-size:16px;font-weight:700;

.btn-ghost{flex:1 1 0;height:50px;border:1px solid var(--line);border-radius:var(--r-btn);background:#fff;font-size:11px;
  font-weight:600;color:var(--t2);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.btn-ghost.done{border-color:var(--brand);color:var(--brand);background:#FFF6F2}

/* ============ 底部弹层（分享） ============ */
#sheetMask{position:absolute;inset:0;z-index:1000;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .3s ease}
#sheetMask.on{opacity:1;pointer-events:auto}
.bsheet{position:absolute;left:0;right:0;bottom:0;z-index:1010;transform:translateY(110%);
  transition:transform .34s cubic-bezier(.32,.72,0,1)}
.bsheet.on{transform:translateY(0)}
/* 分享 */
#share{padding:0 8px var(--safe-b);max-height:calc(100% - 62px);overflow-y:auto}

.as-card{background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-radius:14px;overflow:hidden;margin-bottom:8px}

.as-body{padding:13px}

.as-cancel:active{background:rgba(0,0,0,.05)}
.chans{display:flex;padding:8px 4px 4px}
.chan{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:var(--t2)}
.chan .ci{width:40px;height:40px;border-radius:99px;display:grid;place-items:center;color:#fff;font-size:17px}
/* 9:16 分享卡 */
.scard{width:190px;margin:0 auto;border-radius:12px;overflow:hidden;background:#fff;position:relative;
  box-shadow:0 8px 24px rgba(0,0,0,.16)}
.scard .top{position:relative;width:100%;aspect-ratio:4/3;background:#E7E9EC;overflow:hidden}
.scard .top img{width:100%;height:100%;object-fit:cover;display:block}
.scard .top.img-fallback{background:linear-gradient(135deg,#E7E9EC,#D7DAE0 52%,#EEF0F3)}
.scard .top.img-fallback img{display:none}
.scard .top.img-fallback::after{content:attr(data-emoji);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;opacity:.85}
.scard .plat{position:absolute;left:9px;top:9px;height:20px;padding:0 7px;border-radius:999px;background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.scard .in{padding:11px}
.scard .st{font-size:13px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.scard .sc{margin-top:8px;position:relative;padding:6px 8px 6px 9px;border-radius:6px;background:#FFF4EE;font-size:10px;
  font-weight:600;line-height:1.45;color:#3A2B24}
.scard .sc::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2.5px;border-radius:999px;background:var(--brand)}
.scard .sq{margin-top:8px;font-size:10px;line-height:1.5;color:#4A4A56;background:#F7F8FA;border-radius:6px;padding:6px 8px}
.scard .sq b{color:var(--brand);font-size:9px}
.scard .ft{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.qr{width:36px;height:36px;flex:0 0 auto;border-radius:4px;border:2.5px solid #1A1A1E;
  background:conic-gradient(from 0deg,#1A1A1E 0 25%,#fff 0 50%,#1A1A1E 0 75%,#fff 0);background-size:6px 6px}
.scard .ft .t{font-size:8.5px;color:var(--t2);line-height:1.5;flex:1 1 auto}
.scard .ft .t b{display:block;font-size:9.5px;color:var(--t1)}

/* ============ 我的 ============ */
.mehead{padding:66px 16px 16px;display:flex;align-items:center;gap:13px}
.mehead .av{width:54px;height:54px;border-radius:999px;background:linear-gradient(135deg,#FF6B35,#F2A25C);display:grid;

.mehead .t b{font-size:18px;display:block}
.mehead .t span{font-size:12px;color:var(--t3)}
.group{margin:12px 16px;background:#fff;border-radius:12px;overflow:hidden}
.gtitle{font-size:11.5px;color:var(--t3);padding:0 16px 6px;margin-top:18px;font-weight:600}
.item{display:flex;align-items:center;gap:11px;padding:13px 14px;box-shadow:0 .5px 0 var(--line);width:100%;text-align:left}
.item:last-child{box-shadow:none}

.item .tx{flex:1 1 auto;min-width:0}
.item .tx b{font-size:14.5px;font-weight:500;display:block}
.item .tx i{font-size:11px;color:var(--t3);font-style:normal}
.item .val{font-size:12.5px;color:var(--t3);flex:0 0 auto}
.item .ar{color:#C4C4CC;flex:0 0 auto}
/* 内部看板 */
#pushBoard{background:#0F1419}
.seg{display:flex;padding:3px;border-radius:9px;background:rgba(120,120,128,.2);margin:8px 16px 4px}
.seg button{flex:1 1 0;height:30px;border-radius:7px;font-size:13px;font-weight:600;color:#8E8E93;transition:.2s}
.seg button.on{background:#fff;color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.14)}
#boardBody{padding:8px 16px 56px}
.bdark{color:#E6EDF3}
.pcard{background:#1A1F26;border:1px solid #232C36;border-radius:12px;padding:14px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .lb{font-size:11.5px;color:#8896A4;font-weight:600}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:700;color:#F2F7FA;margin-top:6px}
.kpi .v small{font-size:11px;color:#8896A4;font-weight:500;margin-left:3px}
.kpi .dt{font-family:var(--mono);font-size:11px;font-weight:700;color:#00D9A3;margin-left:4px}
.kpi .note{font-size:10px;color:#6E7C8A;margin-top:5px;line-height:1.5}
.bsec{margin-top:18px}
.bsec h3{margin:0 0 9px;font-size:13.5px;font-weight:700}
.bsec .hint{font-size:10.5px;color:#6E7C8A;font-weight:400;margin-left:6px}
.fun{display:flex;flex-direction:column;gap:10px}
.fseg .fl{display:flex;align-items:baseline;gap:6px;font-size:11.5px;color:#8896A4;margin-bottom:5px}
.fseg .fl b{font-family:var(--mono);font-size:15px;color:#00D9A3;font-weight:700}
.fseg .fl .pc{font-family:var(--mono);margin-left:auto;font-size:10.5px}
.fbar{height:9px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
.fbar i{display:block;height:100%;border-radius:999px;background:rgba(0,217,163,.55);width:0;transition:width .8s cubic-bezier(.32,.72,0,1)}
.fseg.hot .fl b{color:#FFB454}
.fseg.hot .fbar i{background:rgba(255,180,84,.6)}
.floss{font-size:10px;color:#6E7C8A;margin-top:5px;line-height:1.5}
.fseg.hot .floss{color:#FFB454;font-weight:600}
.blight{color:#1A2230}
.ccard{background:#fff;border:1px solid #E3E7ED;border-radius:12px;padding:14px}
.cm .lb{font-size:11.5px;color:#5A6472;font-weight:600}
.cm .v{font-size:25px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.cm .note{font-size:10.5px;color:#7A8494;margin-top:5px;line-height:1.6}
.vs{display:grid;grid-template-columns:1fr 1fr;border-radius:10px;overflow:hidden;border:1px solid #E3E7ED;background:#fff}
.vs>div{padding:12px}
.vs .bad{background:#FDF7F7;border-right:1px solid #E3E7ED}

.vs .bad h5{color:#C53030}.vs .good h5{color:#2F9E63}
.vs ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.vs li{font-size:11.5px;line-height:1.45;color:#3A4452;display:flex;gap:5px}
.note-line{margin-top:11px;font-size:10.5px;color:#7A8494;line-height:1.7}

}

"use strict";
/* =========================================================================

/* 来源行日期：2026-08-11 19:02 → 8月11日 */
function dateCn(s){
  const m=/(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s||"");
  return m ? (+m[2])+"月"+(+m[3])+"日" : "";
}
function throttle(fn,wait){
  let last=0,timer=null;
  return function(){
    const now=Date.now();
    if(now-last>=wait){last=now;fn();}
    else if(!timer){timer=setTimeout(()=>{timer=null;last=Date.now();fn();},wait-(now-last));}
  };
}

function verdictCls(v){
  if(/别买/.test(v)) return "bad";
  if(/值得买|优先/.test(v)) return "good";
  return "mid";
}
function specCard(p){
  const s=p.spec||{};
  const cell=(v,l,c)=>'<div><b'+(c?' class="'+c+'"':'')+'>'+esc(v)+'</b><span>'+l+'</span></div>';
  if(p.vertical==="gear")  return '<div class="speccard">'+cell(s.verdict,"选购结论",verdictCls(s.verdict))+cell(s.price,"价格带")+cell(s.test,"实测方式")+'</div>';
  if(p.vertical==="trail") return '<div class="speccard">'+cell(s.dist,"全程距离")+cell("↑"+s.gain,"累计爬升")+cell(s.hours,"参考耗时")
    +cell(s.level,"强度",/硬核|偏难|暂勿/.test(s.level)?"bad":/新手/.test(s.level)?"good":"mid")+'</div>';
  if(p.vertical==="movie")  return '<div class="speccard">'+cell(s.kind,"内容类型")+cell(s.score,"平台评分")
    +cell(s.spoiler,"剧透程度",/中度|含情节/.test(s.spoiler)?"mid":"good")+'</div>';
  return '<div class="speccard">'+cell(s.kind,"内容类型")+cell(s.lang,"原文语言")+cell(s.fresh,"时效")+'</div>';
}

function estHeight(p){
  const w=166;
  if(p.type==="text"){
    const big=((p.poster&&p.poster.big)||"").length;
    return 42 + Math.ceil(big/9)*29 + 28 + (p.summary?38:0) + 34;
  }
  if(p.type==="agg") return w*3/4 + 30 + Math.ceil((p.title||"").length/12)*23 + 28 + 16;
  const r=p.imgRatio;
  const ih = r==="16:9"?w*9/16 : r==="4:3"?w*3/4 : r==="1:1"?w : w*4/3;
  return ih + 20 + 41 + 25;

const BATCH=8;
let flow=[], cursor=0, loading=false, firstPaint=true, colH=[0,0], cols=[];
const rendered=new Set();
/* 排序：话题页聚合卡打头；信息流按 图·图·文·图·文·聚合 的节奏交替，避免整屏同形态 */
function mixTypes(list){
  const agg=list.filter(p=>p.type==="agg");
  const pic=list.filter(p=>!p.type);
  const txt=list.filter(p=>p.type==="text");
  const out=agg.slice(); let i=0,j=0;
  while(i<pic.length||j<txt.length){
    if(i<pic.length) out.push(pic[i++]);
    if(i<pic.length) out.push(pic[i++]);
    if(j<txt.length) out.push(txt[j++]);
  }
  return out;
}
function rrByTopic(pool,pred){
  const buckets=DATA.topics.map(t=>pool.filter(p=>p.topic===t.key&&pred(p)));
  const out=[]; let i=0, more=true;
  while(more){ more=false; buckets.forEach(b=>{ if(b[i]){ out.push(b[i]); more=true; } }); i++; }
  return out;
}
function compose(pic,txt,agg){
  const out=[]; let i=0,j=0,k=0;
  while(i<pic.length||j<txt.length||k<agg.length){
    if(i<pic.length) out.push(pic[i++]);
    if(i<pic.length) out.push(pic[i++]);
    if(j<txt.length) out.push(txt[j++]);
    if(i<pic.length) out.push(pic[i++]);
    if(j<txt.length) out.push(txt[j++]);
    if(k<agg.length) out.push(agg[k++]);
  }
  return out;
}
function buildFlow(){
  const pool = curCh==="rec" ? DATA.posts : DATA.posts.filter(p=>p.channel===curCh);
  return compose(rrByTopic(pool,p=>!p.type), rrByTopic(pool,p=>p.type==="text"), rrByTopic(pool,p=>p.type==="agg"));
}
function paint(nodes){
  nodes.forEach((el,i)=>{
    if(REDUCED){ el.classList.add("in"); return; }
    el.style.transitionDelay=(i*38)+"ms";
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("in")));
  });
}
function renderBatch(){
  const slice=flow.slice(cursor,cursor+BATCH);
  if(!slice.length) return;
  const frags=[document.createDocumentFragment(),document.createDocumentFragment()];
  slice.forEach(p=>{
    const idx = colH[0]<=colH[1] ? 0 : 1;        /* 插入累计高度较短的一列 */
    const holder=document.createElement("div");
    holder.innerHTML=cardHTML(p);
    frags[idx].appendChild(holder.firstChild);
    colH[idx]+=estHeight(p)+14;
    rendered.add(p.id);
  });
  const fresh=[...$$(".qcard",frags[0]),...$$(".qcard",frags[1])];
  cols[0].appendChild(frags[0]); cols[1].appendChild(frags[1]);
  cursor+=slice.length;
  paint(fresh);
}
function renderFeed(){
  flow=buildFlow(); cursor=0; colH=[0,0]; rendered.clear();
  const old=$(".endtip",feed.parentNode); if(old) old.remove();

let pullY=null, pullOn=false, dragFrom=null, dragged=false;
pgHome.addEventListener("pointerdown",e=>{
  dragFrom={x:e.clientX,y:e.clientY}; dragged=false;
  pullY = pgHome.scrollTop<=0 ? e.clientY : null;
});
pgHome.addEventListener("pointermove",e=>{
  if(dragFrom&&(Math.abs(e.clientX-dragFrom.x)>8||Math.abs(e.clientY-dragFrom.y)>8)) dragged=true;
  if(pullY===null||pgHome.scrollTop>0) return;
  const dy=e.clientY-pullY; if(dy<=0) return;
  pullOn=true; ptr.classList.remove("anim");
  ptr.style.height=Math.min(dy*0.5,70)+"px";
});
function endPull(){
  if(pullY===null) return;
  pullY=null; if(!pullOn) return;
  pullOn=false;
  const h=parseFloat(ptr.style.height)||0;
  ptr.classList.add("anim");
  if(h>=40){ ptr.style.height="54px"; setTimeout(()=>{ ptr.style.height="0px"; prependFresh(); },800); }
  else ptr.style.height="0px";
}
["pointerup","pointercancel","pointerleave"].forEach(t=>pgHome.addEventListener(t,endPull));
function prependFresh(){
  if(!cols.length) return;
  let picks=flow.filter(p=>!rendered.has(p.id)).slice(-2);
  if(picks.length<2) picks=flow.slice(-2);
  const fresh=[];
  picks.forEach((p,i)=>{
    const old=feed.querySelector('.qcard[data-id="'+p.id+'"]'); if(old) old.remove();
    const holder=document.createElement("div");
    holder.innerHTML=cardHTML(p,true);
    const node=holder.firstChild;
    cols[i%2].insertBefore(node, cols[i%2].firstChild);
    colH[i%2]+=estHeight(p)+14;
    rendered.add(p.id); fresh.push(node);
  });
  paint(fresh);
}

    + '<div class="lb">'+k.lb+'</div><div class="v">'+k.v+'<small>'+k.u+'</small><span class="dt">'+k.dt+'</span></div>'
    + '<div class="note">'+k.note+'</div></div>').join("")+'</div>'
    + '<div class="bsec"><h3>生产漏斗<span class="hint">种子 → 取回 → 结构化 → 过审入库</span></h3><div class="pcard"><div class="fun">'
    + DATA.funnel.map(f=>'<div class="fseg'+(f.hot?" hot":"")+'">'
    +   '<div class="fl"><b>'+cma(f.n)+'</b><span>'+f.name+'</span><span class="pc">转化 '+f.pct+'</span></div>'
    +   '<div class="fbar"><i data-w="'+Math.round(f.n/total*100)+'"></i></div>'
    +   '<div class="floss">'+f.loss+'</div></div>').join("")
    + '</div></div></div></div>';
}
function compHTML(){
  return '<div class="blight">'+DATA.compKpis.map(k=>'<div class="ccard cm" style="margin-bottom:10px">'
    + '<div class="lb">'+k.lb+'</div><div class="v">'+k.v+'</div><div class="note">'+k.note+'</div></div>').join("")
    + '<div class="bsec"><h3>我们与「内容截流」的区别</h3><div class="vs">'
    + '<div class="bad"><h5>❌ 内容截流</h5><ul>'+DATA.vsLeft.map(t=>'<li><span>✕</span><span>'+esc(t)+'</span></li>').join("")+'</ul></div>'
    + '<div class="good"><h5>✅ 看世界</h5><ul>'+DATA.vsRight.map(t=>'<li><span>✓</span><span>'+esc(t)+'</span></li>').join("")+'</ul></div>'
    + '</div><div class="note-line">商业目标是让浏览器被打开，而不是让用户停在我们的流里 —— 把读者送回原站对我们是收益。</div></div></div>';
}
function renderBoard(){
  const dark=boardSeg==="pipe";
  pushBoard.style.background=dark?"#0F1419":"#F7F8FA";
  $("#boardBody").innerHTML=dark?pipeHTML():compHTML();
  const nav=$("#bnav");
  nav.style.background=dark?"rgba(15,20,25,.92)":"rgba(247,248,250,.92)";
  nav.style.color=dark?"#E6EDF3":"#1A2230";
  setStatus(dark);
  requestAnimationFrame(()=>{ $$("#boardBody .fbar i").forEach(i=>{ i.style.width=i.dataset.w+"%"; }); });
}
function openBoard(){
  pushBoard.innerHTML='<div class="pnav solid" id="bnav"><button class="back tap" id="bBack">'+backIcon()+'</button>'
    + '<span class="ptitle" style="opacity:1">内部数据看板</span><span class="navico"></span></div>'
    + '<div class="pscroll" style="padding-top:98px">'
    + '<div class="seg" id="bseg"><button class="on" data-b="pipe">生产链路</button><button data-b="comp">内容合规</button></div>'
    + '<div id="boardBody"></div></div>';
  boardSeg="pipe"; renderBoard();
  requestAnimationFrame(()=>pushBoard.classList.add("on"));
  $("#bBack").addEventListener("click",closeBoard);
  $("#bseg").addEventListener("click",e=>{
    const b=e.target.closest("button[data-b]"); if(!b) return;
    $$("#bseg button").forEach(x=>x.classList.toggle("on",x===b));
    boardSeg=b.dataset.b; renderBoard();
  });
}
function closeBoard(){
  pushBoard.classList.remove("on"); setStatus(false);
  setTimeout(()=>{ if(!pushBoard.classList.contains("on")) pushBoard.innerHTML=""; },340);
}

/* 首屏 */
renderFeed();
</script>
</body>
</html>
